<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ワードル風 単語当てゲーム</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="skip-link" href="#keyboard">キーボード入力へスキップ</a>

  <header>
    <h1>単語当てゲーム</h1>
    <p class="subtitle">5文字の英単語を6回以内に当てよう</p>
  </header>

  <main>
    <section aria-labelledby="board-heading">
      <h2 id="board-heading" class="visually-hidden">推測ボード</h2>
      <div id="board" role="grid" aria-label="推測ボード。各行が1回の推測を表します。"></div>
    </section>

    <p id="status" role="status" aria-live="polite" class="status"></p>

    <section aria-labelledby="keyboard-heading">
      <h2 id="keyboard-heading" class="visually-hidden">文字入力キーボード</h2>
      <div id="keyboard" aria-label="オンスクリーンキーボード"></div>
    </section>

    <div class="controls">
      <button id="new-game-btn" type="button">新しいゲーム</button>
      <button id="how-to-btn" type="button" aria-expanded="false" aria-controls="how-to-panel">
        遊び方
      </button>
    </div>

    <div id="how-to-panel" class="how-to" hidden>
      <h2>遊び方</h2>
      <ul>
        <li>5文字の英単語を推測して入力し、Enterで確定します。</li>
        <li>物理キーボードまたは画面上のキーボードで文字を入力できます。</li>
        <li><strong>緑（✓）</strong>: その文字は正しい位置にあります。</li>
        <li><strong>黄（〜）</strong>: その文字は単語に含まれますが位置が違います。</li>
        <li><strong>グレー（✗）</strong>: その文字は単語に含まれません。</li>
        <li>6回以内に単語を当てればクリアです。</li>
      </ul>
    </div>
  </main>

  <div id="sr-announcer" class="visually-hidden" aria-live="assertive" aria-atomic="true"></div>

  <footer>
    <p>すべての操作はキーボードのみで完結します。</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
